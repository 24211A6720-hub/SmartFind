# ===== SmartFind configuration =====
spring.application.name=smartfind
server.port=8080

# ----- MySQL (change username/password to match YOUR MySQL) -----
spring.datasource.url=jdbc:mysql://localhost:3306/smartfind?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root

# ----- JPA / Hibernate: creates and updates tables automatically -----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ----- JWT (DEVELOPMENT SECRET - change before any real deployment; min 32 chars) -----
smartfind.jwt.secret=smartfind-dev-secret-key-change-me-0123456789
smartfind.jwt.expiration-ms=86400000

# ----- CORS: React dev server -----
smartfind.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# ----- Matching engine (weights should add up to 100) -----
smartfind.match.name-weight=25
smartfind.match.category-weight=20
smartfind.match.color-weight=15
smartfind.match.location-weight=15
smartfind.match.date-weight=10
smartfind.match.description-weight=15
smartfind.match.strong=80
smartfind.match.possible=60
smartfind.match.notify-threshold=80
smartfind.match.min-store=20
smartfind.match.date-max-days=14
